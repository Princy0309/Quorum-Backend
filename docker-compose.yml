version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: quorum_postgres
    restart: always
    environment:
      POSTGRES_USER: quorum_user
      POSTGRES_PASSWORD: quorum_password
      POSTGRES_DB: quorum_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

 
  redis:
    image: redis:7-alpine
    container_name: quorum_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data


  app:
    build: .
    container_name: quorum_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://quorum_user:quorum_password@postgres:5432/quorum_db?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:

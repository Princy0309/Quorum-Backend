name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
             # 1. Free up disk space: remove the 2GB swapfile
             sudo swapoff /swapfile 2>/dev/null || true
             sudo rm -f /swapfile 2>/dev/null || true

             # 2. Aggressively clean up Docker cache & journal logs
             sudo docker system prune -af || true
             sudo journalctl --vacuum-size=10M || true
             sudo apt-get clean || true
             sudo fuser -k 5000/tcp || true

             # 3. Pull latest code from dev branch
             cd ~/Quorum-Backend
             git remote set-url origin https://github.com/Princy0309/Quorum-Backend.git
             git fetch origin dev
             git reset --hard origin/dev

             # 4. Stop old containers and build fresh
             sudo docker compose down || true
             sudo docker compose up -d --build

             # 5. Sync Prisma schema to Postgres
             sudo docker compose exec -T app npx prisma db push

             # 6. Print recent app container logs
             sudo docker compose logs --tail=50 app
